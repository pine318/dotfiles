# 端末
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"  # truecolor
set -sg escape-time 10                    # vim で ESC が遅れないようにする
set -g focus-events on
set -g history-limit 10000

# マウス操作（ホイールでスクロールするとコピーモードに入る）
set -g mouse on
# 外側の端末のスクロールバックを使えるようにする
set -as terminal-overrides ",xterm*:smcup@:rmcup@"

# コピーモードを vi 風に
setw -g mode-keys vi

# クリップボード連携
#   OSC52 で外側の端末（Windows Terminal など）のクリップボードへコピーする。WSL・SSH 先でも動く
#   macOS / X11 環境ではコマンドでもコピーする
set -s set-clipboard on
if-shell 'uname | grep -q Darwin' 'set -s copy-command pbcopy'
if-shell '[ -n "$DISPLAY" ] && command -v xsel' "set -s copy-command 'xsel -ib'"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Y send -X copy-pipe
